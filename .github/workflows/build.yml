name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-template:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install template
      run: dotnet new install . --force

    - name: Generate project from template
      run: dotnet new blazortailwind -n TestProject -o /tmp/test-project

    - name: Restore dependencies
      run: dotnet restore
      working-directory: /tmp/test-project

    - name: Install npm packages
      run: npm install
      working-directory: /tmp/test-project

    - name: Build
      run: dotnet build --no-restore
      working-directory: /tmp/test-project
